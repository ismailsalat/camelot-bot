# Only used if you switch Railway's builder from Dockerfile to Nixpacks.
# The Dockerfile is the recommended path (see railway.json + DEPLOY.md).
[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci || npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node dist/index.js"
